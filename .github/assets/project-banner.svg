<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Developer Portfolio</title>
  <desc id="desc">Single-page software engineering portfolio</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.14">
    <circle cy="55" r="34"><animate attributeName="cx" values="-40;1240;-40" dur="12s" repeatCount="indefinite"/></circle>
    <circle cy="260" r="52"><animate attributeName="cx" values="1240;-40;1240" dur="16s" repeatCount="indefinite"/></circle>
    <circle cy="160" r="22"><animate attributeName="cx" values="100;1100;100" dur="9s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="600" y="135" font-size="54" font-weight="700" filter="url(#glow)">Developer Portfolio</text>
    <text x="600" y="190" font-size="25" opacity="0.94">Single-page software engineering portfolio</text>
  </g>
  <rect x="350" y="235" width="500" height="6" rx="3" fill="#ffffff" opacity="0.25"/>
  <rect x="350" y="235" height="6" rx="3" fill="#ffffff">
    <animate attributeName="width" values="0;500;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="350;350;850" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>

